<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - TerraTech</title>
    <link rel="icon" href="/img/Logo proyecto.jpeg">
    <link rel="stylesheet" href="/Estilos/CrearContraseña.css">
</head>
<body>
    <main class="card-container">
        <!-- Sección del logotipo -->
        <header class="logo-section">
            <!-- Logo -->
            <img src="/img/Logo proyecto.jpeg" alt="Logo TerraTech" class="logo-img">
        </header>

        <!-- Textos principales -->
        <section class="info-section">
            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu correo electronico y te enviaremos codigo de confirmacion</p>
        </section>

        <!-- Formulario -->
        <form action="#" method="POST" class="recovery-form">
            <div class="input-group">
                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo" name="correo" placeholder="Ingresar" required>
            </div>

            <button type="submit" class="btn-submit">Enviar codigo</button>
        </form>

        <!-- Enlace de regreso -->
        <footer class="back-section">
            <a href="#" class="back-link">
                <span class="arrow">&larr;</span> Atras
            </a>
        </footer>
    </main>
</body>
</html>
