<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="icon" href="../img/Logo proyecto.jpeg">
    <link rel="stylesheet" href="../html/CrearCuenta.html">
    <link rel="stylesheet" href="../Estilos/styles.css">
    
</head>
<body>
    <div class="login-container">
            <!-- Logo -->
            <div class="logo-section">
                <img src="../img/Logo proyecto.jpeg" alt="Logo Terratech" class="logo-imagen">
            </div>
    <div>
        <h1 class="h1">Crear Usuario</h1>
        <h3 class="h3">Completas tus datos para avanzar</h3>
        <form>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu nombre">
            </div>

            <div class="form-group">
                <label for="Fecha de nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" class="form-control" placeholder="Ingresa tu fecha de nacimiento">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Ingresa tu email">

            <!-- Rol -->
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <div class="input-container">
                        <select id="rol" class="form-control">
                            <option value="" disabled selected>Selecciona tu rol</option>
                            <option value="admin">Administrador</option>
                            <option value="instructor">Instructor</option>
                            <option value="aprendiz">Aprendiz</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu usuario">
            </div>
            <button type="submit" class="btn-submit">Crear cuenta</button>
        </form>
    </div>
</body>
</html>
