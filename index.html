<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terratech - Iniciar Sesión</title>
    <link rel="icon" href="img/Logo proyecto.jpeg">
    <link rel="stylesheet" href="Estilos/styles.css">
 

</head>
<body>

    <div class="mobile-frame">
        <div class="login-container">
            <!-- Logo -->
            <div class="logo-inicio">
                <img src="img/Logo proyecto.jpeg" alt="Logo Terratech" class="logo-imagen">
            </div>

            <div class="subtitle">Ingresa tus datos</div>

            <form>
                <!-- Rol -->
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <div class="input-container">
                        <select id="rol" class="form-control">
                            <option value="" disabled selected>Selecciona tu rol</option>
                            <option value="admin">Administrador</option>
                            <option value="instructor">Instructor</option>
                            <option value="aprendiz">Aprendiz</option>
                        </select>
                    </div>
                </div>

                <!-- Usuario -->
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-container">
                        <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu usuario">
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <div class="input-container">
                        <input type="password" id="contrasena" class="form-control" placeholder="Ingresa tu contraseña">
                        <i class="fa-regular fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <!-- Botón Iniciar Sesión -->
                <button type="submit" class="btn-submit">Iniciar sesion</button>
            </form>

            <!-- Enlaces inferiores -->
            <div class="footer-links">
                <a href="/html/CrearCuenta.html">Crear cuenta</a>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>
""
    <!-- Script para alternar la visibilidad de la contraseña -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#contrasena');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
